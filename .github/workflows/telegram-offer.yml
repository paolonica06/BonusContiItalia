name: Telegram Offer Update

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = solo cambi (+ riepilogo il lunedi), force-weekly = riepilogo ora, dry-run = stampa senza inviare"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - force-weekly
          - dry-run
  schedule:
    - cron: "30 8 * * *"

permissions:
  contents: write

concurrency:
  group: telegram-offer
  cancel-in-progress: false

jobs:
  telegram-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python3 -m pip install --upgrade pip pillow

      - name: Check Telegram configuration
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ github.event.inputs.mode || 'auto' }}
        run: |
          if [ "${MODE}" != "dry-run" ] && [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "TELEGRAM_CHAT_ID mancante"
            exit 1
          fi
          echo "Modalita: ${MODE}"

      - name: Publish changes and weekly summary
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          MODE: ${{ github.event.inputs.mode || 'auto' }}
        run: |
          python3 scripts/telegram_changes.py \
            --mode "${MODE}" \
            --base-url "${SITE_BASE_URL}"

      - name: Commit Telegram state
        run: |
          git add data/telegram-state.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica allo stato."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Aggiorna stato Telegram"
          git pull --rebase
          git push
